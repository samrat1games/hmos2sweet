# Recompress an existing ROM artifact with zstd so it can be downloaded over a slow link.
name: recompress rom

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run id that holds the curtana-rom artifact"
        required: true
        default: "41656541296"
      artifact:
        description: "artifact name"
        required: true
        default: "curtana-rom"
      level:
        description: "zstd level"
        required: false
        default: "19"

permissions:
  actions: read
  contents: read

jobs:
  recompress:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift
          df -h /

      - name: install zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: fetch the existing artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          ART: ${{ inputs.artifact }}
        run: |
          mkdir -p "$RUNNER_TEMP/in"
          gh run download "$RUN_ID" -R "${{ github.repository }}" -n "$ART" -D "$RUNNER_TEMP/in"
          ls -l "$RUNNER_TEMP/in"
          du -sh "$RUNNER_TEMP/in"
          df -h /

      - name: compress
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          cd "$RUNNER_TEMP/in"
          for f in *.img; do
            [ -e "$f" ] || continue
            zstd -q -f -T0 "-$LEVEL" --long=27 "$f" -o "$f.zst"
            printf '%-20s %10s -> %10s\n' "$f" \
              "$(du -h "$f" | cut -f1)" "$(du -h "$f.zst" | cut -f1)"
          done
          rm -f *.img
          ls -l
          du -sh .
          df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: curtana-rom-zst
          retention-days: 5
          compression-level: 0
          path: |
            ${{ runner.temp }}/in/*.zst
            ${{ runner.temp }}/in/*.sh
            ${{ runner.temp }}/in/*.bat
            ${{ runner.temp }}/in/BUILD_INFO.txt

      - name: sizes
        if: always()
        run: du -sh "$RUNNER_TEMP/in"; df -h /
